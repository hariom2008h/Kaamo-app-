name: Android build

on:
  push:
    branches: [main]
    paths-ignore: ["web/**"]
  pull_request:
    paths-ignore: ["web/**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Demo mode build: no Supabase keys needed. To build against a real backend, add repository
      # secrets SUPABASE_URL and SUPABASE_ANON_KEY and uncomment the next step.
      # - name: Write local.properties
      #   run: |
      #     echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> local.properties
      #     echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> local.properties

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: kaamo-debug-apk
          path: app/build/outputs/apk/debug/*.apk
